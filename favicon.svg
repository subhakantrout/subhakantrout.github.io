  <rect x="57" y="33" width="4" height="8" fill="#00F0FF" rx="0.5" />
  
  <line x1="66" y1="24" x2="66" y2="40" stroke="#00F0FF" stroke-width="1.5" />
  <rect x="64" y="27" width="4" height="10" fill="#00F0FF" rx="0.5" />

  <!-- P Monogram (Cyan) -->
  <path d="M 49 52 L 64 36 C 73 36, 78 41, 78 48 C 78 55, 71 59, 62 59 L 57 59 L 57 71 L 49 71 Z M 57 44 L 57 52 L 62 52 C 67 52, 70 50, 70 48 C 70 45, 67 44, 62 44 Z" fill="url(#cyanGlow)" />
